# Render Blueprint: FastAPI backend + RQ worker + Redis. The frontend deploys to Vercel (see README).
services:
  - type: web
    name: workflowwise-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: supabase
      - key: STORAGE_BACKEND
        value: supabase
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: workflowwise-redis
          property: connectionString

  - type: worker
    name: workflowwise-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: APP_ENV
        value: production
      - key: STORAGE_BACKEND
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: workflowwise-redis
          property: connectionString

  - type: keyvalue
    name: workflowwise-redis
    ipAllowList: []
    plan: free
